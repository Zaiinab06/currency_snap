name: currency_snap
description: "A modern fintech currency converter and analytics Flutter application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  dio: ^5.11.0
  shared_preferences: ^2.5.5
  fl_chart: ^1.2.0
  home_widget: ^0.9.3
  intl: ^0.20.3
  get_it: ^9.2.1
  country_flags: ^3.1.0
  google_fonts: ^6.2.1
  connectivity_plus: ^7.3.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
